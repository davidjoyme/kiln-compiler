# File: pyproject.toml
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
version = "0.1.0"
description = "An MLIR-based inference compiler for PyTorch models"
readme = "README.md"
requires-python = ">=3.10"
# MLIR's Python bindings come from your own LLVM build (see scripts/env.sh),
# so they are not listed here.
dependencies = ["torch>=2.4", "numpy"]

# GPU backend (device="cuda"): Triton, which ships with CUDA builds of PyTorch.

[project.optional-dependencies]
dev = ["pytest", "lit", "filecheck"]

[project.scripts]
kiln-opt = "kiln.tools.opt:main"

[tool.setuptools.packages.find]
include = ["kiln*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Triton's CPU interpreter (used for GPU tests without a GPU) evaluates masked-off
# lanes too, e.g. rsqrt(0) past the end of a row; those values are never stored.
filterwarnings = ["ignore::RuntimeWarning:triton.runtime.interpreter"]